name: Test Brawlytix skins source

on:
  push:
    branches:
      - test/brawlytix-skins-source
    paths:
      - scripts/test-brawlytix-skins.mjs
      - .github/workflows/test-brawlytix-skins.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test player profiles
        run: node scripts/test-brawlytix-skins.mjs 2JU9CUC Q9JRJVYL0
