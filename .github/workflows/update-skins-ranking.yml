name: Atualizar ranking de skins BBR
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - preview-ranking-skins-top50
    paths:
      - 'scripts/update-skins-ranking.mjs'
      - '.github/workflows/update-skins-ranking.yml'
permissions:
  contents: write
concurrency:
  group: ranking-skins-update
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Consultar clubes e gerar TOP 50
        run: node scripts/update-skins-ranking.mjs
      - name: Salvar snapshot no repositorio
        run: |
          if git diff --quiet -- ranking-skins-data.json && git ls-files --error-unmatch ranking-skins-data.json >/dev/null 2>&1; then
            echo "Sem alteracoes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ranking-skins-data.json
          git commit -m "data: atualizar TOP 50 de skins"
          git push
