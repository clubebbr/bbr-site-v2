<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Resultados BBR Awards</title><style>body{font:16px system-ui;background:#130d09;color:#f6e8ca;max-width:840px;margin:auto;padding:30px 18px}h1{color:#e8ba67}input,button{font:inherit;padding:12px;border-radius:8px}input{background:#2b1a10;color:white;border:1px solid #9a733d;max-width:95%}button{background:#e8ba67;border:0;cursor:pointer}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #493626;text-align:left}section{margin:25px 0}small{color:#ceb58d}</style><h1>🏆 BBR Awards — Resultados</h1><p>Área de administração. Informe a chave de acesso configurada para consultar as indicações.</p><form id="auth"><label for="key">Chave de acesso</label><br><input id="key" type="password" autocomplete="off" required><button>Consultar</button></form><p><button type="button" id="test-db">Testar conexão com o banco</button></p><p id="message" role="status"></p><div id="results"></div><small>Nomes escritos de maneiras diferentes podem precisar de revisão antes da apuração.</small><script>const names={mitica:'Melhor Skin Mítica',lendaria:'Melhor Skin Lendária',mais_legal:'Membro Mais Legal',melhor_membro:'Melhor Membro',perfil:'Perfil Mais Bonito',ranqueada:'Melhor Jogador de Ranqueada'};function renderRows(items,out){for(const [id,title] of Object.entries(names)){const rows=items.filter(x=>x.category===id);if(!rows.length)continue;const section=document.createElement('section'),heading=document.createElement('h2'),table=document.createElement('table');heading.textContent=title;for(const item of rows){const tr=document.createElement('tr');for(const val of [item.nominee,item.total]){const td=document.createElement('td');td.textContent=val;tr.append(td)}table.append(tr)}section.append(heading,table);out.append(section)}}document.querySelector('#auth').addEventListener('submit',async e=>{e.preventDefault();const msg=document.querySelector('#message'),out=document.querySelector('#results');out.replaceChildren();msg.textContent='Consultando...';try{const res=await fetch('/api/awards/results',{headers:{Authorization:'Bearer '+document.querySelector('#key').value},cache:'no-store'});const data=await res.json();if(!res.ok)throw new Error(data.error||'Não foi possível consultar.');msg.textContent=data.results.length?'Resultados atuais:':'Ainda não há indicações.';renderRows(data.results,out)}catch(err){msg.textContent=err.message}});document.querySelector('#test-db').addEventListener('click',async()=>{const msg=document.querySelector('#message');const key=document.querySelector('#key').value;if(!key){msg.textContent='Informe a chave de acesso.';return}msg.textContent='Testando conexão...';try{const res=await fetch('/api/awards/test',{method:'POST',headers:{Authorization:'Bearer '+key},cache:'no-store'});const data=await res.json();if(!res.ok)throw new Error(data.error||'Falha no teste.');msg.textContent='Conexão confirmada! O registro de teste foi removido.'}catch(e){msg.textContent=e.message||'Falha no teste.'}});</script></html>
