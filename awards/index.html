<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BBR Awards 2026 — Indicações</title><style>*{box-sizing:border-box}body{margin:0;background:#110b09;color:#f8edcf;font:16px system-ui;min-height:100vh}body::before{content:'';position:fixed;inset:0;z-index:-1;background:#110b09 url(fundo-awards-suave.webp) center center / cover no-repeat}main{max-width:720px;margin:auto;padding:38px 20px 70px}header{text-align:center}.logo-awards{display:block;width:min(100%,340px);height:auto;margin:0 auto 12px}small{letter-spacing:.25em;color:#d8ac57}h1{font-size:clamp(2.4rem,8vw,4rem);margin:.3em 0;color:#f4d17d}h2{font-size:1.08rem;margin:0 0 8px}p{color:#d6c5a3;line-height:1.5}.notice,.card{border:1px solid #8a5729;border-radius:16px;background:#201810dd;padding:20px;margin:16px 0}.notice{background:#4b351d}label{display:block;margin:14px 0 7px}input,select,button{width:100%;padding:13px;border-radius:9px;font:inherit}input,select{background:#140f0b;color:#fff;border:1px solid #806b48}button{background:#e9a43b;color:#221500;font-weight:700;border:0;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.foot{font-size:.85rem}.icone-raridade{width:30px;height:30px;object-fit:contain;vertical-align:middle;margin-right:8px}.artes-skins{display:grid;gap:12px;margin:16px 0}.arte-skin{display:block;width:100%;height:auto;border-radius:10px}</style><script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script></head><body><main><header><img class="logo-awards" src="logo-awards-2026-atualizada.png" alt="BBR Awards 2026"><p>Indique seus favoritos e ajude a escolher os finalistas!</p></header><div class="notice"><strong>Período de indicações</strong><p>As indicações acontecem de 1º a 13 de dezembro, no horário de Brasília.</p></div><form id="nomination-form"><div id="membros"></div><div class="cf-turnstile" data-sitekey="0x4AAAAAAF9IfNym-K2_qp-6" data-theme="dark"></div><button type="submit">Enviar indicações</button><p id="status-envio" role="status"></p></form></main><script>const nomes=['💜 Membro Mais Legal','🌟 Melhor Membro','👤 Perfil Mais Bonito','🎯 Melhor Jogador de Ranqueada'];nomes.forEach((nome,i)=>{const card=document.createElement('div');card.className='card';const title=document.createElement('h2');title.textContent=nome;const label=document.createElement('label');label.htmlFor='m'+i;label.textContent='Digite o nome da sua indicação';const input=document.createElement('input');input.id='m'+i;input.name=['mais_legal','melhor_membro','perfil','ranqueada'][i];input.maxLength=100;input.placeholder='Nome do membro';card.append(title,label,input);document.getElementById('membros').append(card)});document.querySelector('#nomination-form').addEventListener('submit',async e=>{e.preventDefault();const currentForm=e.currentTarget;const status=document.querySelector('#status-envio'),button=currentForm.querySelector('button[type=submit]');const form=new FormData(currentForm);const token=form.get('cf-turnstile-response');form.delete('cf-turnstile-response');const dados=Object.fromEntries([...form].filter(([,v])=>typeof v==='string'&&v.trim()));if(!Object.keys(dados).length){status.textContent='Escolha pelo menos uma indicação.';return}if(!token){status.textContent='Aguarde a verificação de segurança e tente novamente.';return}button.disabled=true;status.textContent='Enviando...';try{const res=await fetch('/api/awards/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nominations:dados,turnstileToken:token})});const data=await res.json();if(!res.ok)throw new Error(data.error||'Não foi possível enviar.');status.textContent='Indicações enviadas! Obrigado por participar.';currentForm.reset()}catch(err){status.textContent=err.message||'Não foi possível enviar.'}finally{button.disabled=false;if(window.turnstile)window.turnstile.reset()}});</script></body></html>
